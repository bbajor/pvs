version: '3.8'

services:
  # Main Application
  pvs-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pvs-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - PORT=8080
      # Whisper Container URL - use service name for internal Docker network
      - AI_WHISPER_LOCAL_HOST=whisper
      - AI_WHISPER_LOCAL_PORT=9000
    depends_on:
      whisper:
        condition: service_healthy
    networks:
      - pvs-network
    restart: unless-stopped
    volumes:
      # Mount H2 database file for persistence (if using file-based H2)
      - pvs-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Whisper AI Service
  whisper:
    build:
      context: .
      dockerfile: docker/whisper/Dockerfile
    container_name: pvs-whisper
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
    networks:
      - pvs-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  pvs-network:
    driver: bridge

volumes:
  pvs-data:
    driver: local

