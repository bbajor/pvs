version: '3.8'

services:
  whisper:
    build:
      context: ../..
      dockerfile: docker/whisper/Dockerfile
    container_name: pvs-whisper
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

