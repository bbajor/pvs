# Traefik Static Configuration
# Production-Ready Configuration mit Security Best Practices

# API & Dashboard
api:
  dashboard: true
  insecure: false  # Dashboard nur über HTTPS

# Entry Points
entryPoints:
  web:
    address: ":80"
    # HTTP → HTTPS Redirect
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        # TLS 1.2+ nur (preferiert TLS 1.3)
        options: default
        certResolver: letsencrypt
      # Security Middlewares
      middlewares:
        - securityHeaders@file
        - rateLimit@file

# Providers
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: pvs-network
  
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Let's Encrypt Certificate Resolver
certificatesResolvers:
  letsencrypt:
    acme:
      email: ${LETSENCRYPT_EMAIL}
      storage: /letsencrypt/acme.json
      # TLS-ALPN-01 Challenge (empfohlen)
      tlsChallenge: {}
      # HTTP-01 Challenge (Fallback)
      # httpChallenge:
      #   entryPoint: web

# Logging
log:
  level: INFO
  filePath: /var/log/traefik/traefik.log
  format: json

# Access Logs
accessLog:
  filePath: /var/log/traefik/access.log
  format: json
  filters:
    statusCodes:
      - "400-599"  # Nur Errors loggen
  fields:
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        X-Forwarded-For: keep

# Metrics
metrics:
  prometheus:
    buckets:
      - 0.1
      - 0.3
      - 1.0
      - 3.0
      - 5.0
    addEntryPointsLabels: true
    addServicesLabels: true
    entryPoint: metrics

# Global Options
global:
  checkNewVersion: true
  sendAnonymousUsage: false

# TLS Options
tls:
  options:
    default:
      minVersion: VersionTLS12
      preferServerCipherSuites: true
      cipherSuites:
        # TLS 1.3 Cipher Suites (automatisch)
        # TLS 1.2 Cipher Suites (sicher)
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      curvePreferences:
        - CurveP521
        - CurveP384
      sniStrict: true
