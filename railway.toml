# Railway.app Configuration für Multi-Stage Deployment

[build]
builder = "DOCKERFILE"
dockerfilePath = "./Dockerfile"

[deploy]
startCommand = "java $JAVA_OPTS -jar app.jar"
healthcheckPath = "/actuator/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment Variables werden pro Service in Railway Dashboard gesetzt:
# - SPRING_PROFILES_ACTIVE (dev/test/prod)
# - DATABASE_URL (wird von Railway PostgreSQL Service automatisch gesetzt)
# - AI_WHISPER_LOCAL_ENABLED=false

