name: CI (dev)

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Gradle Build + Test
        run: |
          ./gradlew --no-daemon clean build test

  maven-kbv-masterdata-service:
    if: ${{ hashFiles('kbv-masterdata-service/pom.xml') != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kbv-masterdata-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven Verify
        run: mvn -B -DskipTests=false clean verify

