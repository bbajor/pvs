name: Deploy to Production (Render)

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (use with caution)'
        required: false
        default: false
        type: boolean

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar --no-daemon

      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        run: ./gradlew test --no-daemon

      - name: Validate Flyway migrations
        run: |
          # Install Flyway CLI for validation
          wget -qO- https://download.red-gate.com/maven/flyway/commandline/9.22.0/flyway-commandline-9.22.0-linux-x64.tar.gz | tar xvz
          sudo ln -s `pwd`/flyway-9.22.0/flyway /usr/local/bin/flyway
          flyway info -url=jdbc:postgresql://${{ secrets.PROD_DB_HOST }}/${{ secrets.PROD_DB_NAME }} -user=${{ secrets.PROD_DB_USER }} -password=${{ secrets.PROD_DB_PASSWORD }} -locations=filesystem:src/main/resources/db/migration
        continue-on-error: false

      - name: Manual approval for production
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ secrets.PROD_APPROVERS }}
          minimum-approvals: 1
          issue-title: "Production Deployment Approval Required"
          issue-body: "Production deployment is pending approval. Commit: ${{ github.sha }}"

      - name: Deploy to Render (Production)
        uses: johnbeynon/render-deploy@v1.1.2
        with:
          service-id: ${{ secrets.RENDER_PROD_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

      - name: Verify deployment
        run: |
          sleep 60
          HEALTH_CHECK=$(curl -s https://${{ secrets.RENDER_PROD_URL }}/actuator/health)
          echo "Health check response: $HEALTH_CHECK"
          if echo "$HEALTH_CHECK" | grep -q '"status":"UP"'; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment health check failed"
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "Production deployment failed! Consider rolling back immediately."
          # Add notification webhook here if needed

