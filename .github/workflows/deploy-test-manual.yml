name: Deploy Test to Hetzner (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: 'Bist du sicher? Alle Tests müssen erfolgreich sein!'
        required: true
        type: choice
        options:
          - 'Nein, abbrechen'
          - 'Ja, deployen zu Test-Umgebung'

jobs:
  deploy-test:
    name: Deploy to Test Environment
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_deployment == 'Ja, deployen zu Test-Umgebung'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: test  # Stelle sicher, dass test Branch deployed wird

      - name: Verify test branch
        run: |
          CURRENT_BRANCH=$(git branch --show-current 2>/dev/null || echo "${{ github.ref_name }}")
          if [ "$CURRENT_BRANCH" != "test" ]; then
            echo "⚠️  Warnung: Nicht auf test Branch!"
            echo "   Aktueller Branch: $CURRENT_BRANCH"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest test image
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/pvs:test-latest || echo "⚠️ Image noch nicht vorhanden - baue neu"

      - name: Deploy to Hetzner (Test)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /opt/pvs
            echo "🔄 Deploye Test-Umgebung..."
            
            # Stelle sicher, dass Image vorhanden ist
            docker pull ghcr.io/${{ github.repository_owner }}/pvs:test-latest || {
              echo "❌ Image nicht gefunden. Stelle sicher, dass Test-Branch CI erfolgreich war."
              exit 1
            }
            
            # Backup aktueller Container (optional)
            docker tag ghcr.io/${{ github.repository_owner }}/pvs:test-latest \
                       ghcr.io/${{ github.repository_owner }}/pvs:test-backup-$(date +%Y%m%d-%H%M%S) || true
            
            # Deploy
            docker-compose -f docker-compose.production.yml --profile test up -d pvs-test
            
            # Warte auf Health Check
            echo "⏳ Warte auf Health Check..."
            sleep 30
            
            # Health Check
            if docker exec pvs-test curl -f http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "✅ Deployment erfolgreich - Health Check bestanden"
            else
              echo "❌ Health Check fehlgeschlagen"
              echo "📋 Container Logs:"
              docker-compose -f docker-compose.production.yml --profile test logs --tail=50 pvs-test
              exit 1
            fi

      - name: Deployment Summary
        run: |
          echo "✅ Test-Umgebung erfolgreich deployed!"
          echo ""
          echo "📝 Nächste Schritte:"
          echo "   1. Verbinde dich via VPN zum Hetzner Server"
          echo "   2. Teste die Oberfläche: http://<server-ip>:8080"
          echo "   3. Führe abschließende UI-Tests durch"
          echo "   4. Wenn alles OK: Merge test → master für Production"
