name: Auto-add @cursor when moved to In Progress

on:
  project_card:
    types:
      - moved
      - created

jobs:
  add_cursor_comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Get project column name
        id: get_column
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COLUMN_ID="${{ github.event.project_card.column_id }}"
          COLUMN_INFO=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/projects/columns/$COLUMN_ID")
          
          COLUMN_NAME=$(echo "$COLUMN_INFO" | jq -r '.name')
          echo "column_name=$COLUMN_NAME" >> $GITHUB_OUTPUT
          echo "📋 Column name: $COLUMN_NAME"

      - name: Check if moved to 'In Progress'
        id: check_in_progress
        run: |
          COLUMN_NAME="${{ steps.get_column.outputs.column_name }}"
          # Case-insensitive check for "In Progress"
          if echo "$COLUMN_NAME" | grep -qi "in progress"; then
            echo "is_in_progress=true" >> $GITHUB_OUTPUT
            echo "✅ Card moved to 'In Progress' column"
          else
            echo "is_in_progress=false" >> $GITHUB_OUTPUT
            echo "⏭️  Card not in 'In Progress' column - skipping"
          fi

      - name: Get issue URL from card
        id: get_issue
        if: steps.check_in_progress.outputs.is_in_progress == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CARD_ID="${{ github.event.project_card.id }}"
          CARD_INFO=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/projects/columns/cards/$CARD_ID")
          
          CONTENT_URL=$(echo "$CARD_INFO" | jq -r '.content_url // empty')
          echo "content_url=$CONTENT_URL" >> $GITHUB_OUTPUT
          
          if [ -n "$CONTENT_URL" ] && [[ "$CONTENT_URL" == *"/issues/"* ]]; then
            ISSUE_NUMBER=$(echo "$CONTENT_URL" | grep -oE '/issues/[0-9]+' | grep -oE '[0-9]+')
            echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
            echo "🔗 Found issue: #$ISSUE_NUMBER"
          else
            echo "⚠️  No issue URL found in card (might be a note)"
            echo "issue_number=" >> $GITHUB_OUTPUT
          fi

      - name: Check if @cursor comment already exists
        id: check_existing
        if: steps.check_in_progress.outputs.is_in_progress == 'true' && steps.get_issue.outputs.issue_number
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="${{ steps.get_issue.outputs.issue_number }}"
          COMMENTS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments")
          
          # Check if any comment contains @cursor
          HAS_CURSOR=$(echo "$COMMENTS" | jq -r '.[].body' | grep -c "@cursor" || echo "0")
          if [ "$HAS_CURSOR" -gt 0 ]; then
            echo "comment_exists=true" >> $GITHUB_OUTPUT
            echo "💬 @cursor comment already exists - skipping"
          else
            echo "comment_exists=false" >> $GITHUB_OUTPUT
            echo "✨ No @cursor comment found - will add one"
          fi

      - name: Add @cursor comment to issue
        if: steps.check_in_progress.outputs.is_in_progress == 'true' && 
            steps.get_issue.outputs.issue_number && 
            steps.check_existing.outputs.comment_exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="${{ steps.get_issue.outputs.issue_number }}"
          RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
            -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{"body": "@cursor"}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments")
          
          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
          if [ "$HTTP_CODE" -eq 201 ]; then
            echo "✅ Successfully added @cursor comment to issue #$ISSUE_NUMBER"
          else
            echo "❌ Failed to add comment. HTTP Code: $HTTP_CODE"
            echo "$RESPONSE" | head -20
            exit 1
          fi

