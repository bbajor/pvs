name: Dev Branch CI & Build

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build, Test & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pvs:dev-latest
            ghcr.io/${{ github.repository_owner }}/pvs:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "✅ Dev Branch CI erfolgreich - Docker Image gepusht"
          echo ""
          echo "📝 Nächste Schritte:"
          echo "   - Lokal: Nutze './gradlew bootRun' für H2 (schnelles Testing)"
          echo "   - Lokal: Nutze 'docker-compose.dev.yml' für PostgreSQL Container"
          echo "   - Image verfügbar: ghcr.io/${{ github.repository_owner }}/pvs:dev-latest"

