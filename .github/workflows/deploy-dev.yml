name: Dev Branch CI & Build

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build, Test & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check for code changes
        id: check-changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Bei PRs: Prüfe ob Java-Code oder wichtige Configs geändert wurden
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
          else
            # Bei Push: Prüfe Änderungen seit letztem Commit (spart Build-Zeit bei Docs-only)
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          fi
          
          if [ -z "$CHANGED_FILES" ]; then
            # Keine Änderungen gefunden, sicherheitshalber bauen
            echo "code_changed=true" >> $GITHUB_OUTPUT
          elif echo "$CHANGED_FILES" | grep -qE '\.(java|gradle|properties|yaml|yml)$|Dockerfile|build\.gradle|package\.json|vite\.config'; then
            echo "code_changed=true" >> $GITHUB_OUTPUT
            echo "📝 Code-Änderungen erkannt: $(echo "$CHANGED_FILES" | head -5 | tr '\n' ', ')"
          else
            echo "code_changed=false" >> $GITHUB_OUTPUT
            echo "⏭️ Nur non-code Änderungen (Docs/Config), überspringe Build"
          fi

      - name: Build with Gradle (skip tests für schnellere Builds)
        if: steps.check-changes.outputs.code_changed == 'true'
        run: ./gradlew build --no-daemon -x test --build-cache --parallel
        continue-on-error: false

      - name: Run tests (optional für dev)
        if: steps.check-changes.outputs.code_changed == 'true'
        run: ./gradlew test --no-daemon --build-cache --parallel
        continue-on-error: true  # Dev-Branch toleriert fehlgeschlagene Tests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.check-changes.outputs.code_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pvs:dev-latest
            ghcr.io/${{ github.repository_owner }}/pvs:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Zusätzliche Build-Args für Optimierung
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          # Platforms nur wenn nötig (spart Zeit)
          platforms: linux/amd64

      - name: Summary
        run: |
          echo "✅ Dev Branch CI erfolgreich - Docker Image gepusht"
          echo ""
          echo "📝 Nächste Schritte:"
          echo "   - Lokal: Nutze './gradlew bootRun' für H2 (schnelles Testing)"
          echo "   - Lokal: Nutze 'docker-compose.dev.yml' für PostgreSQL Container"
          echo "   - Image verfügbar: ghcr.io/${{ github.repository_owner }}/pvs:dev-latest"

