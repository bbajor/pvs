name: Deploy Production to Hetzner

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (use with caution)'
        required: false
        default: false
        type: boolean

jobs:
  build-and-deploy-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar --no-daemon

      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        run: ./gradlew test --no-daemon

      - name: Validate Flyway migrations
        run: |
          wget -qO- https://download.red-gate.com/maven/flyway/commandline/9.22.0/flyway-commandline-9.22.0-linux-x64.tar.gz | tar xvz
          sudo ln -s `pwd`/flyway-9.22.0/flyway /usr/local/bin/flyway
          flyway info -url=jdbc:postgresql://${{ secrets.PROD_DB_HOST }}/${{ secrets.PROD_DB_NAME }} -user=${{ secrets.PROD_DB_USER }} -password=${{ secrets.PROD_DB_PASSWORD }} -locations=filesystem:src/main/resources/db/migration
        continue-on-error: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pvs:prod-latest
            ghcr.io/${{ github.repository_owner }}/pvs:prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Hetzner Production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /opt/pvs
            
            # Backup current production
            podman tag ghcr.io/${{ github.repository_owner }}/pvs:prod-latest ghcr.io/${{ github.repository_owner }}/pvs:prod-backup-$(date +%Y%m%d-%H%M%S) || true
            
            # Pull and deploy
            podman pull ghcr.io/${{ github.repository_owner }}/pvs:prod-latest
            podman-compose -f podman-compose.production.yml pull pvs-prod
            podman-compose -f podman-compose.production.yml up -d pvs-prod
            
            # Wait for health check
            echo "⏳ Waiting for application to start..."
            sleep 60
            
            # Health check via container
            if ! podman exec pvs-prod curl -f http://localhost:8080/actuator/health 2>/dev/null; then
              echo "❌ Health check failed - rolling back..."
              podman-compose -f podman-compose.production.yml restart pvs-prod
              sleep 30
              exit 1
            fi
            
            echo "✅ Health check passed!"
            
            # Clean up old images
            docker image prune -f
            
            echo "Production deployment successful"
            echo ""
            echo "⚠️  IMPORTANT: Check application logs for Super-Admin initial password"
            echo "   The password is only shown on first startup if no Super-Admin exists."
            echo "   Command: docker logs pvs-prod | grep -A 10 'SUPER-ADMIN INITIAL PASSWORD'"

