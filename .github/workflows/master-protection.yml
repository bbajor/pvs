name: Master Branch Protection

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Run architecture tests
        run: ./gradlew test --tests "*ArchitectureTest" --no-daemon
        continue-on-error: false

  validate:
    name: Validation Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate application configs
        run: |
          # Prüfe dass keine hardcodierten Credentials in prod/test Configs sind
          if grep -r "password.*=" src/main/resources/application-prod.yaml || \
             grep -r "password.*=" src/main/resources/application-test.yaml; then
            echo "❌ ERROR: Hardcoded passwords found in production/test configs!"
            exit 1
          fi
          echo "✅ No hardcoded credentials found"

