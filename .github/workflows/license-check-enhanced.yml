name: License Check (Enhanced)

on:
  push:
    branches: [ dev, test, master ]
  pull_request:
    branches: [ dev, test, master ]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-licenses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run license check script
        id: license-check
        run: |
          node .github/scripts/license-check.js
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const summaryPath = path.join(process.env.GITHUB_WORKSPACE, '.github/license-check-results.md');
            
            let comment = '## 🔍 Lizenzprüfung\n\n';
            
            if (fs.existsSync(summaryPath)) {
              const summary = fs.readFileSync(summaryPath, 'utf8');
              comment += summary;
            } else {
              comment += '✅ Keine lizenzrechtlich problematischen Referenzen gefunden\n\n';
            }
            
            comment += '\n---\n';
            comment += '**Hinweis:** Diese Prüfung sucht nach Software mit kommerziellen Lizenzanforderungen.\n';
            comment += 'Empfohlen: Verwende Podman statt Docker Desktop (Apache 2.0, keine kommerziellen Einschränkungen).\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail on errors
        if: steps.license-check.outputs.exit_code != '0'
        run: |
          echo "::error::Lizenzrechtlich problematische Software gefunden!"
          exit 1

