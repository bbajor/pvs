name: Deploy (test-hetzner)

on:
  push:
    branches: [ test ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:test-latest
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  deploy:
    runs-on: ubuntu-latest
    needs: [ build-and-push-image ]
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: ${{ secrets.TEST_SSH_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          source: "podman-compose.production.yml"
          target: "~/pvs"
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: ${{ secrets.TEST_SSH_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          script: |
            set -e
            cd ~/pvs
            echo ${{ secrets.GITHUB_TOKEN }} | podman login ghcr.io -u ${{ github.actor }} --password-stdin
            export DOCKER_REGISTRY=ghcr.io
            export DOCKER_IMAGE=${{ github.repository }}
            # Try podman compose first, fallback to podman-compose
            if command -v podman-compose &> /dev/null; then
              COMPOSE_CMD="podman-compose"
            elif podman compose version &> /dev/null; then
              COMPOSE_CMD="podman compose"
            else
              echo "Error: Neither podman-compose nor podman compose available"
              exit 1
            fi
            $COMPOSE_CMD -f podman-compose.production.yml --profile test pull
            $COMPOSE_CMD -f podman-compose.production.yml --profile test up -d
name: Test Branch CI & Build

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Validate Flyway migrations
        run: |
          # Install Flyway CLI for validation
          wget -qO- https://download.red-gate.com/maven/flyway/commandline/9.22.0/flyway-commandline-9.22.0-linux-x64.tar.gz | tar xvz
          sudo ln -s `pwd`/flyway-9.22.0/flyway /usr/local/bin/flyway
          flyway info -url=jdbc:postgresql://${{ secrets.TEST_DB_HOST }}/${{ secrets.TEST_DB_NAME }} -user=${{ secrets.TEST_DB_USER }} -password=${{ secrets.TEST_DB_PASSWORD }} -locations=filesystem:src/main/resources/db/migration
        continue-on-error: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pvs:test-latest
            ghcr.io/${{ github.repository_owner }}/pvs:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "✅ Test Branch CI & Build erfolgreich"
          echo ""
          echo "📝 Docker Image: ghcr.io/${{ github.repository_owner }}/pvs:test-latest"
          echo ""
          echo "🔧 Manuelles Deployment:"
          echo "   1. Gehe zu: Actions → 'Deploy Test to Hetzner (Manual)'"
          echo "   2. Klicke 'Run workflow' und bestätige"
          echo "   3. Deployment erfolgt zu Test-Umgebung auf Hetzner"
          echo ""
          echo "⚠️  Wichtig: Nur deployen, wenn alle Tests erfolgreich sind!"

