name: Deploy to Test (Render)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Validate Flyway migrations
        run: |
          # Install Flyway CLI for validation
          wget -qO- https://download.red-gate.com/maven/flyway/commandline/9.22.0/flyway-commandline-9.22.0-linux-x64.tar.gz | tar xvz
          sudo ln -s `pwd`/flyway-9.22.0/flyway /usr/local/bin/flyway
          flyway info -url=jdbc:postgresql://${{ secrets.TEST_DB_HOST }}/${{ secrets.TEST_DB_NAME }} -user=${{ secrets.TEST_DB_USER }} -password=${{ secrets.TEST_DB_PASSWORD }} -locations=filesystem:src/main/resources/db/migration
        continue-on-error: false

      - name: Deploy to Render (Test)
        uses: johnbeynon/render-deploy@v1.1.2
        with:
          service-id: ${{ secrets.RENDER_TEST_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

      - name: Verify deployment
        run: |
          sleep 30
          curl -f https://${{ secrets.RENDER_TEST_URL }}/actuator/health || exit 1

