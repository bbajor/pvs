name: Deploy (test-hetzner)

on:
  push:
    branches: [ test ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:test-latest
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  deploy:
    runs-on: ubuntu-latest
    needs: [ build-and-push-image ]
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: ${{ secrets.TEST_SSH_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          source: "podman-compose.production.yml"
          target: "~/pvs"
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: ${{ secrets.TEST_SSH_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          script: |
            set -e
            cd ~/pvs
            echo ${{ secrets.GITHUB_TOKEN }} | podman login ghcr.io -u ${{ github.actor }} --password-stdin
            export DOCKER_REGISTRY=ghcr.io
            export DOCKER_IMAGE=${{ github.repository }}
            # Try podman compose first, fallback to podman-compose
            if command -v podman-compose &> /dev/null; then
              COMPOSE_CMD="podman-compose"
            elif podman compose version &> /dev/null; then
              COMPOSE_CMD="podman compose"
            else
              echo "Error: Neither podman-compose nor podman compose available"
              exit 1
            fi
            $COMPOSE_CMD -f podman-compose.production.yml --profile test pull
            $COMPOSE_CMD -f podman-compose.production.yml --profile test up -d
