name: Deploy to Test (Hetzner)

on:
  push:
    branches:
      - test
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Validate Flyway migrations
        run: |
          # Install Flyway CLI for validation
          wget -qO- https://download.red-gate.com/maven/flyway/commandline/9.22.0/flyway-commandline-9.22.0-linux-x64.tar.gz | tar xvz
          sudo ln -s `pwd`/flyway-9.22.0/flyway /usr/local/bin/flyway
          flyway info -url=jdbc:postgresql://${{ secrets.TEST_DB_HOST }}/${{ secrets.TEST_DB_NAME }} -user=${{ secrets.TEST_DB_USER }} -password=${{ secrets.TEST_DB_PASSWORD }} -locations=filesystem:src/main/resources/db/migration
        continue-on-error: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pvs:test-latest
            ghcr.io/${{ github.repository_owner }}/pvs:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Hetzner (Test)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /opt/pvs
            docker pull ghcr.io/${{ github.repository_owner }}/pvs:test-latest || echo "Image pull failed, using existing"
            docker-compose -f docker-compose.production.yml --profile test up -d pvs-test
            sleep 30
            docker exec pvs-test curl -f http://localhost:8080/actuator/health || echo "⚠️ Health check failed"

      - name: Verify deployment
        run: |
          sleep 10
          echo "✅ Test deployment completed"

