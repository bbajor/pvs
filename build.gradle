plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.vaadin' version '24.8.3'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'de.bbajor.pvs'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

ext {
    vaadinVersion = '24.8.3'
    archunitVersion = '1.4.1'
    mapstructVersion = '1.5.5.Final'
    instancioVersion = '5.5.1'
}

repositories {
    mavenCentral()
    maven { url 'https://maven.vaadin.com/vaadin-addons' }
}

dependencyManagement {
    imports {
        mavenBom "com.vaadin:vaadin-bom:${vaadinVersion}"
    }
}

dependencies {
    implementation 'com.vaadin:vaadin'
    implementation 'com.vaadin:vaadin-spring-boot-starter'
    implementation 'com.vaadin:control-center-starter'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    // In-memory DB for local development (fixes missing JDBC driver)
    runtimeOnly 'com.h2database:h2'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'org.apache.ant:ant:1.10.6'

    // Flyway for database migrations
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    implementation "org.instancio:instancio-core:${instancioVersion}"
    testImplementation "org.instancio:instancio-junit:${instancioVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
}

 tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

vaadin {
    // default configuration; prepare/build frontend tasks available
}

spotless {
    java {
        toggleOffOn()
        eclipse().configFile "$rootDir/eclipse-formatter.xml"
    }
    format('typescript') {
        target 'src/main/frontend/**/*.ts', 'src/main/frontend/**/*.tsx'
        targetExclude 'src/main/frontend/generated/**'
        prettier().configFile("$rootDir/.prettierrc.json")
    }
}
