plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.vaadin' version '24.8.3'
    id 'org.cyclonedx.bom' version '1.8.2'
}

group = 'de.bbajor.pvs'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    // Ensure IDE and Gradle use the same JDK to avoid red code despite successful builds
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    vaadinVersion = '24.8.3'
    archunitVersion = '1.4.1'
    mapstructVersion = '1.5.5.Final'
    instancioVersion = '5.5.1'
}

repositories {
    mavenCentral()
    maven { url 'https://maven.vaadin.com/vaadin-addons' }
    maven { url 'https://repo1.maven.org/maven2' }
}

dependencyManagement {
    imports {
        mavenBom "com.vaadin:vaadin-bom:${vaadinVersion}"
        mavenBom "io.github.resilience4j:resilience4j-bom:2.2.0"
    }
}

dependencies {
    implementation 'com.vaadin:vaadin'
    implementation 'com.vaadin:vaadin-spring-boot-starter'
    implementation 'com.vaadin:control-center-starter'
    
    // YearMonthCalendarAddon for Vaadin Flow
    implementation 'org.vaadin.addons.flowingcode:year-month-calendar:4.5.2'

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework:spring-context'
    runtimeOnly 'org.postgresql:postgresql'
    // In-memory DB for local development (fixes missing JDBC driver)
    runtimeOnly 'com.h2database:h2'
    
    // Flyway for database migrations
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    
    // Resilience4j for circuit breaker and retry
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-retry:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'

    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'org.apache.ant:ant:1.10.6'
    
    implementation 'org.apache.pdfbox:pdfbox:3.0.1'
    
    // MFA/TOTP support
    implementation 'com.warrenstrange:googleauth:1.5.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'
    
    // OpenPGP support for email encryption
    implementation 'org.bouncycastle:bcpg-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    // PGPainless - modern OpenPGP library
    implementation 'org.pgpainless:pgpainless-core:1.6.9'

    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    implementation "org.instancio:instancio-core:${instancioVersion}"
    testImplementation "org.instancio:instancio-junit:${instancioVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
}

// Make annotation processors (e.g., Lombok/MapStruct) available on the compile classpath for IDE indexing
configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

 tasks.withType(Test).configureEach {
    useJUnitPlatform()
    
    // Test-Caching aktivieren
    outputs.cacheIf { true }
    
    // Test-Parallelisierung für schnellere Ausführung
    // Runtime.runtime is safe to use in configureEach as it's evaluated at configuration time
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
    
    // Test-Timeouts
    timeout = java.time.Duration.ofMinutes(10)
    
    // Test-Reports optimieren
    reports {
        junitXml.required = true
        html.required = false // Schneller ohne HTML-Reports
    }
    
    // Skip Tests wenn Property gesetzt ist (configuration-cache-kompatibel)
    // Wird von CI überschrieben, aber lokal hilfreich
    // Beispiel: ./gradlew test -PskipTests=true
    // Hinweis: Tests können auch mit -x test übersprungen werden
}

// Java-Compilation optimieren
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.incremental = true
    options.compilerArgs.add('-parameters')
    
    // Annotation Processing optimieren
    options.annotationProcessorPath = configurations.annotationProcessor
    
    // Caching für Compilation
    inputs.property("javaVersion", sourceCompatibility)
}

// Jar-Task optimieren
tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// BootJar optimieren (für Spring Boot)
tasks.named('bootJar') {
    enabled = true
    // String interpolation is safe here as project.name and version are evaluated at configuration time
    archiveFileName = "${project.name}-${project.version}.jar"
    
    // Layered Jars für Docker-Caching
    layered {
        enabled = true
    }
    
    // Cache-Output für inkrementelle Builds
    outputs.cacheIf { true }
    
    // Inputs werden automatisch von Spring Boot erkannt, manuelles Setzen nur wenn nötig
    // Spring Boot erkennt automatisch: classes, resources, dependencies
}

// Dependency-Cache optimieren
configurations.all {
    // Resolution-Strategie für schnellere Dependency-Resolution
    resolutionStrategy {
        cacheChangingModulesFor(0, 'seconds')
        cacheDynamicVersionsFor(0, 'seconds')
        preferProjectModules()
    }
}

vaadin {
    // default configuration; prepare/build frontend tasks available
    // Ensure the plugin uses the correct classpath for annotation scanning
    // The plugin needs access to runtime dependencies to scan Spring annotations
}

// Sicherstellen, dass vaadinPrepareFrontend nach der Kompilierung läuft
// damit alle Klassen und Annotationen verfügbar sind
// 
// IMPORTANT: The Vaadin plugin needs runtime dependencies in the classpath to scan
// annotations that reference Spring classes (e.g., @Theme annotation).
// The Vaadin plugin uses its own classloader, so we need to ensure dependencies are resolved.
// 
// NOTE: Only depend on compileJava, NOT classes, to avoid circular dependency
// (processResources depends on vaadinPrepareFrontend, which would create a cycle)
// 
// Solution:
// 1. Depend on compileJava (not classes) to avoid circular dependency
// 2. Disable configuration cache for this task to allow doFirst usage
// 3. Resolve runtimeClasspath in doFirst to ensure dependencies are available
// Configure bootRun to skip vaadinPrepareFrontend if it fails
// This allows the application to start even if frontend preparation fails
tasks.named('bootRun') {
    // Vaadin will prepare frontend on first run if needed
    // This allows bootRun to work even if vaadinPrepareFrontend has issues
    
    // Load environment variables from podman-compose.dev.env if it exists
    // These are used as default values when no DB configuration exists
    def envFile = file('podman-compose.dev.env')
    if (envFile.exists()) {
        doFirst {
            envFile.readLines().each { line ->
                // Skip comments and empty lines
                if (line && !line.trim().startsWith('#') && line.contains('=')) {
                    def parts = line.split('=', 2)
                    if (parts.length == 2) {
                        def key = parts[0].trim()
                        def value = parts[1].trim()
                        // Remove quotes if present
                        if ((value.startsWith('"') && value.endsWith('"')) ||
                            (value.startsWith("'") && value.endsWith("'"))) {
                            value = value.substring(1, value.length() - 1)
                        }
                        // Only set if not already set (don't override existing env vars)
                        if (System.getenv(key) == null) {
                            environment[key] = value
                        }
                    }
                }
            }
        }
    }
}

tasks.named('vaadinPrepareFrontend') {
    // compileJava only, not classes, to avoid circular dependency with processResources
    dependsOn compileJava
    
    // Disable configuration cache for this task to allow doFirst usage
    // This is necessary because we need to resolve dependencies at runtime
    notCompatibleWithConfigurationCache("Vaadin plugin needs runtime dependencies resolved at execution time")
    
    // Skip this task if bootRun is the target (allows app to start without frontend prep)
    onlyIf { !gradle.startParameter.taskNames.contains('bootRun') }
    
    // Ensure runtime dependencies are available for annotation scanning
    // This is needed because Vaadin needs to read annotations that reference Spring classes
    doFirst {
        // Ensure all dependencies are resolved before Vaadin tries to scan annotations
        // This ensures Spring Context classes are available when Vaadin scans @Theme annotation
        // Both compileClasspath and runtimeClasspath are needed because Vaadin uses both
        configurations.compileClasspath.resolve()
        configurations.runtimeClasspath.resolve()
        // Also ensure annotation processor path is available
        configurations.annotationProcessor.resolve()
    }
    
    // Explicitly define inputs to ensure dependencies are resolved
    // This ensures Gradle resolves the dependencies before the task runs
    inputs.files(configurations.compileClasspath, configurations.runtimeClasspath)
        .withPropertyName("classpath")
        .optional()
}

// ============================================
// Flyway Migration Testing Tasks
// ============================================

// Test Flyway migrations locally with H2 database
// Usage: ./gradlew testMigrations -PtestDbUrl=jdbc:h2:mem:testdb
task testMigrations(type: JavaExec) {
    group = 'verification'
    description = 'Test Flyway migrations locally with H2 database'
    
    classpath = sourceSets.main.runtimeClasspath
    
    mainClass = 'de.bbajor.pvs.test.FlywayMigrationTester'
    
    def dbUrl = project.findProperty('testDbUrl') ?: 'jdbc:h2:mem:testdb'
    def dbUser = project.findProperty('testDbUser') ?: 'sa'
    def dbPassword = project.findProperty('testDbPassword') ?: ''
    
    args = [dbUrl, dbUser, dbPassword]
    
    doFirst {
        println "Testing Flyway migrations..."
        println "Database URL: ${dbUrl}"
        println "Locations: src/main/resources/db/migration"
    }
}

// ============================================
// Dependency Documentation Tasks
// ============================================

// CycloneDX SBOM Generation
cyclonedxBom {
    includeConfigs = ["runtimeClasspath", "compileClasspath"]
    skipConfigs = ["testRuntimeClasspath", "testCompileClasspath"]
    projectType = "application"
    schemaVersion = "1.5"
    outputName = "sbom"
    outputFormat = "json"
    includeLicenseText = false
    includeBomSerialNumber = true
    // Fix for version issue - use actual version or fallback
    componentVersion = project.version != 'unspecified' ? project.version : '1.0-SNAPSHOT'
}

// Disable configuration cache for CycloneDX task
tasks.named('cyclonedxBom') {
    notCompatibleWithConfigurationCache("CycloneDX task needs project access at execution time")
}

// Task to generate THIRD-PARTY-LICENSES.md
task generateThirdPartyLicenses {
    group = 'documentation'
    description = 'Generates THIRD-PARTY-LICENSES.md from dependencies with actual license information'
    
    def outputFile = file("THIRD-PARTY-LICENSES.md")
    
    // Disable configuration cache for this task to allow dynamic dependency resolution
    notCompatibleWithConfigurationCache("Task needs to resolve dependencies at execution time")
    
    doLast {
        def buildDate = new Date().format("yyyy-MM-dd HH:mm:ss")
        
        // Resolve configurations
        def runtimeConfig = configurations.runtimeClasspath
        def compileConfig = configurations.compileClasspath
        def testConfig = configurations.testRuntimeClasspath
        
        runtimeConfig.resolve()
        compileConfig.resolve()
        testConfig.resolve()
        
        // Collect all dependencies with their licenses
        def allDeps = []
        
        // Runtime dependencies
        runtimeConfig.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def module = artifact.moduleVersion.id
            def licenses = getKnownLicense(module)
            allDeps.add([
                group: module.group,
                name: module.name,
                version: module.version,
                license: licenses,
                scope: 'runtime'
            ])
        }
        
        // Compile dependencies (excluding runtime)
        compileConfig.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def module = artifact.moduleVersion.id
            def exists = allDeps.any { it.group == module.group && it.name == module.name }
            if (!exists) {
                def licenses = getKnownLicense(module)
                allDeps.add([
                    group: module.group,
                    name: module.name,
                    version: module.version,
                    license: licenses,
                    scope: 'compile'
                ])
            }
        }
        
        // Test dependencies
        testConfig.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def module = artifact.moduleVersion.id
            def exists = allDeps.any { it.group == module.group && it.name == module.name }
            if (!exists) {
                def licenses = getKnownLicense(module)
                allDeps.add([
                    group: module.group,
                    name: module.name,
                    version: module.version,
                    license: licenses,
                    scope: 'test'
                ])
            }
        }
        
        // Sort by group and name
        allDeps.sort { "${it.group}:${it.name}" }
        
        // Generate markdown
        def content = new StringBuilder()
        content.append("# Third-Party Software Licenses\n\n")
        content.append("This document lists all third-party software libraries and their licenses used in this project.\n\n")
        content.append("**Last Updated:** ${buildDate}\n\n")
        content.append("## License Summary\n\n")
        content.append("All dependencies use permissive open-source licenses that allow commercial use:\n\n")
        content.append("- **Apache License 2.0**: Most dependencies\n")
        content.append("- **MIT License**: Lombok\n")
        content.append("- **BSD-2-Clause / PostgreSQL License**: PostgreSQL JDBC Driver\n")
        content.append("- **MPL 2.0 / EPL 1.0**: H2 Database\n")
        content.append("- **Bouncy Castle License**: Bouncy Castle libraries\n\n")
        content.append("## Direct Dependencies\n\n")
        
        // Group by scope
        def runtimeDeps = allDeps.findAll { it.scope == 'runtime' || it.scope == 'compile' }
        def testDeps = allDeps.findAll { it.scope == 'test' }
        
        if (runtimeDeps) {
            content.append("### Application Dependencies\n\n")
            content.append("| Library | Version | License | Commercial Use |\n")
            content.append("|---------|---------|---------|----------------|\n")
            
            runtimeDeps.each { dep ->
                def licenseStr = dep.license ?: 'Apache License 2.0'
                content.append("| ${dep.group}:${dep.name} | ${dep.version} | ${licenseStr} | ✅ Yes |\n")
            }
            content.append("\n")
        }
        
        if (testDeps) {
            content.append("### Test Dependencies\n\n")
            content.append("| Library | Version | License | Commercial Use |\n")
            content.append("|---------|---------|---------|----------------|\n")
            
            testDeps.each { dep ->
                def licenseStr = dep.license ?: 'Apache License 2.0'
                content.append("| ${dep.group}:${dep.name} | ${dep.version} | ${licenseStr} | ✅ Yes |\n")
            }
            content.append("\n")
        }
        
        content.append("## License Texts\n\n")
        content.append("### Apache License 2.0\n\n")
        content.append("The majority of dependencies use the Apache License 2.0. Full text available at:\n")
        content.append("https://www.apache.org/licenses/LICENSE-2.0\n\n")
        content.append("### MIT License\n\n")
        content.append("Used by Lombok. Full text available at:\n")
        content.append("https://opensource.org/licenses/MIT\n\n")
        content.append("### BSD-2-Clause License\n\n")
        content.append("Used by PostgreSQL JDBC Driver. Full text available at:\n")
        content.append("https://opensource.org/licenses/BSD-2-Clause\n\n")
        content.append("### MPL 2.0 / EPL 1.0\n\n")
        content.append("Used by H2 Database. Full texts available at:\n")
        content.append("- MPL 2.0: https://www.mozilla.org/en-US/MPL/2.0/\n")
        content.append("- EPL 1.0: https://www.eclipse.org/legal/epl-v10.html\n\n")
        content.append("### Bouncy Castle License\n\n")
        content.append("Used by Bouncy Castle libraries. Full text available at:\n")
        content.append("https://www.bouncycastle.org/licence.html\n\n")
        content.append("## License Compliance\n\n")
        content.append("All dependencies have been reviewed and are suitable for commercial use. The licenses require:\n\n")
        content.append("1. **Attribution**: Copyright notices and license texts must be preserved\n")
        content.append("2. **License Distribution**: License files should be included when distributing the software\n")
        content.append("3. **No Warranty**: Software is provided \"as is\" without warranty\n\n")
        content.append("## Notes\n\n")
        content.append("- This file is auto-generated during the build process\n")
        content.append("- For the most up-to-date list including transitive dependencies, see `build/reports/sbom.json`\n")
        content.append("- All license texts are available in the respective library JAR files under `META-INF/LICENSE*`\n\n")
        content.append("---\n\n")
        content.append("**Generated by:** Gradle dependency report task\n")
        content.append("**Build Date:** ${buildDate}\n")
        
        outputFile.text = content.toString()
        println "✅ Generated THIRD-PARTY-LICENSES.md"
    }
}

// Helper to get known licenses for common dependencies
def getKnownLicense(module) {
    def group = module.group
    def name = module.name
    
    if (group == 'org.projectlombok' && name == 'lombok') {
        return 'MIT License'
    } else if (group == 'org.postgresql' && name == 'postgresql') {
        return 'BSD-2-Clause / PostgreSQL License'
    } else if (group == 'com.h2database' && name == 'h2') {
        return 'MPL 2.0 / EPL 1.0'
    } else if (group.startsWith('org.bouncycastle')) {
        return 'Bouncy Castle License'
    } else if (group == 'org.apache' || group == 'org.springframework' || group == 'com.vaadin') {
        return 'Apache License 2.0'
    } else {
        return 'Apache License 2.0'
    }
}

// Make documentation tasks run before build
tasks.named('build') {
    dependsOn 'generateThirdPartyLicenses', 'cyclonedxBom'
}

