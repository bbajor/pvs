services:
  # Development environment
  - type: web
    name: pvs-dev
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: PORT
        value: 8080
      - key: AI_WHISPER_LOCAL_ENABLED
        value: "false"
    branch: develop
    healthCheckPath: /actuator/health
    autoDeploy: true

  # Test environment
  - type: web
    name: pvs-test
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: test
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: pvs-test-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: pvs-test-db
          property: databaseUser
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: pvs-test-db
          property: databasePassword
      - key: AI_WHISPER_LOCAL_ENABLED
        value: "false"
    branch: main
    healthCheckPath: /actuator/health
    autoDeploy: true

  # Production environment
  - type: web
    name: pvs-prod
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: pvs-prod-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: pvs-prod-db
          property: databaseUser
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: pvs-prod-db
          property: databasePassword
      - key: AI_WHISPER_LOCAL_ENABLED
        value: "false"
      - key: WHISPER_ENABLED
        value: "false"
        sync: false
    branch: main
    healthCheckPath: /actuator/health
    autoDeploy: false  # Manual deployment only

databases:
  # Test database
  - name: pvs-test-db
    plan: starter
    databaseName: pvs_test
    user: pvs_user

  # Production database
  - name: pvs-prod-db
    plan: starter
    databaseName: pvs_prod
    user: pvs_user

