spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
    repair-on-migrate: false
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Server-Konfiguration
server:
  port: ${PORT:8080}
  # Graceful Shutdown für Load Balancer
  shutdown: graceful
  # Session-Timeout
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
        http-only: true
        same-site: lax
  # Forward headers from reverse proxy (kritisch für X-Forwarded-* Header)
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,flyway,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true

logging:
  level:
    root: WARN
    de.bbajor.pvs: INFO
    org.flywaydb: WARN
    org.springframework.web: WARN

vaadin:
  production-mode: true

ai:
  whisper:
    local:
      enabled: ${WHISPER_ENABLED:false}

# SMTP-Konfiguration für Production
# KRITISCH: SMTP_ENCRYPTION_KEY MUSS als Environment-Variable gesetzt sein!
# Keine Default-Werte in Production erlaubt!
smtp:
  encryption:
    key: ${SMTP_ENCRYPTION_KEY}

# MFA configuration
app:
  mfa:
    issuer: ${MFA_ISSUER:PVS}
  update:
    enabled: ${APP_UPDATE_ENABLED:false}
    current-version-file: ${APP_UPDATE_CURRENT_VERSION_FILE:/opt/ivomplaner/current/VERSION}
    latest-version-url: ${APP_UPDATE_LATEST_VERSION_URL:}
    command: ${APP_UPDATE_COMMAND:sudo -n /usr/local/bin/ivomplaner-update-wrapper latest}
