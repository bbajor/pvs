server:
  # Forward Headers Strategy für Reverse-Proxy (Traefik)
  # Verarbeitet X-Forwarded-* Headers korrekt
  forward-headers-strategy: framework
  # Secure Cookies in Production
  servlet:
    session:
      cookie:
        secure: true      # Nur über HTTPS
        http-only: true   # Kein JavaScript-Zugriff
        same-site: strict # CSRF-Protection

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  datasource:
    # PostgreSQL Connection mit SSL
    url: ${DATABASE_URL}?ssl=true&sslmode=require
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      # Connection-Pooling (bereits optimal konfiguriert)
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Connection Test Query
      connection-test-query: SELECT 1
      # Pool-Name für Monitoring
      pool-name: PVS-Production-Pool
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
    repair-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,flyway,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true

logging:
  level:
    root: WARN
    de.bbajor.pvs: INFO
    org.flywaydb: WARN
    org.springframework.web: WARN

vaadin:
  production-mode: true

ai:
  whisper:
    local:
      enabled: ${WHISPER_ENABLED:false}

