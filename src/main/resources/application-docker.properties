server.port=8080

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# PostgreSQL for main app database
spring.datasource.url=jdbc:postgresql://db-app:5432/pvs
spring.datasource.username=pvs
spring.datasource.password=pvs
spring.datasource.hikari.maximum-pool-size=10

spring.flyway.enabled=true
# Note: Java migrations are automatically discovered in the classpath
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
