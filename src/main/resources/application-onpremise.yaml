spring:
  profiles:
    active: onpremise
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/pvs}
    username: ${DB_USER:pvs}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
    repair-on-migrate: false
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,flyway,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true

kbv:
  service:
    health:
      enabled: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
        http-only: true
        same-site: lax
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

logging:
  level:
    root: INFO
    de.bbajor.pvs: INFO
    org.flywaydb: INFO
    org.springframework.web: WARN

vaadin:
  production-mode: true

ai:
  whisper:
    local:
      enabled: ${AI_WHISPER_LOCAL_ENABLED:false}
      host: ${AI_WHISPER_LOCAL_HOST:127.0.0.1}
      port: ${AI_WHISPER_LOCAL_PORT:9000}
      auto-install: false
      use-podman: false

# SMTP-Konfiguration (optional für OnPremise)
# Falls SMTP_ENCRYPTION_KEY gesetzt ist, werden SMTP-Passwörter verschlüsselt gespeichert
smtp:
  encryption:
    key: ${SMTP_ENCRYPTION_KEY:}

# MFA configuration
app:
  update:
    enabled: ${APP_UPDATE_ENABLED:true}
    current-version-file: ${APP_UPDATE_CURRENT_VERSION_FILE:${IVOMPLANER_HOME:/opt/ivomplaner}/current/VERSION}
    latest-version-url: ${APP_UPDATE_LATEST_VERSION_URL:${APP_UPDATE_CHECK_URL:https://github.com/bbajor/pvs/releases/latest/download/VERSION}}
    command: ${APP_UPDATE_COMMAND:sudo -n /usr/local/bin/ivomplaner-update-wrapper latest}
  mfa:
    issuer: ${MFA_ISSUER:PVS}
  # OnPremise: Automatischer Institutionscode (optional)
  # Falls gesetzt, wird dieser Institutionscode automatisch beim Login verwendet
  # und das Institutionscode-Feld in der LoginView ausgeblendet
  onpremise:
    institution-code: ${ONPREMISE_INSTITUTION_CODE:}

