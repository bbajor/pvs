server:
  port: ${PORT:8080}

logging:
  level:
    "org.atmosphere": warn

vaadin:
  launch-browser: true
  # Note: com.flowingcode is required for YearMonthCalendarAddon (https://github.com/FlowingCode/YearMonthCalendarAddon)
  allowed-packages: "com.vaadin,org.vaadin,com.flowingcode,de.bbajor.pvs"
  # Production Mode für Docker-Container (überschreibbar via Environment-Variable)
  production-mode: ${VAADIN_PRODUCTION_MODE:false}
  # Erlaube Production Mode mit Dev-Profil für Docker-Umgebung (überschreibbar via Environment-Variable)
  allow-production-mode-in-dev: ${VAADIN_ALLOW_PRODUCTION_MODE_IN_DEV:false}
  frontend:
    # Erzwinge npm install bei jedem Start im Dev-Mode
    force-install: ${VAADIN_FRONTEND_FORCE_INSTALL:true}
    # Nutze npm statt pnpm (vermeidet zusätzliche Downloads)
    package-manager: ${VAADIN_FRONTEND_PACKAGE_MANAGER:npm}

spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        type: trace
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:h2:mem:pvs;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

egk:
  tool-path: "C:/Program Files/OpenSC Project/OpenSC/tools/egk-tool.exe"

domain:
  bundesland: NI

ai:
  whisper:
    local:
      enabled: true
      host: localhost
      port: 9000
      auto-install: true
      python-path: "python"
      use-podman: true
      podman-image: "pvs-whisper:latest"
      podman-compose-path: "docker/whisper/podman-compose.yml"
    remote:
      enabled: true
      provider: "aleph-alpha"
      api-url: "https://api.aleph-alpha.com/complete"
      api-key: ${AI_API_KEY:}
      monthly-quota: 1000
  extraction:
    confidence-threshold: 0.7
