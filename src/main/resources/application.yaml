server:
  port: ${PORT:8080}

logging:
  level:
    "org.atmosphere": warn

vaadin:
  launch-browser: true
  allowed-packages: "com.vaadin,org.vaadin,com.flowingcode,de.bbajor.pvs"

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
  profiles:
    active: dev

egk:
  tool-path: "C:/Program Files/OpenSC Project/OpenSC/tools/egk-tool.exe"

domain:
  bundesland: NI

ai:
  whisper:
    local:
      enabled: true
      host: localhost
      port: 9000
      auto-install: true
      python-path: "python"
      use-docker: true
      docker-image: "pvs-whisper:latest"
      docker-compose-path: "docker/whisper/docker-compose.yml"
    remote:
      enabled: true
      provider: "aleph-alpha"
      api-url: "https://api.aleph-alpha.com/complete"
      api-key: ${AI_API_KEY:}
      monthly-quota: 1000
  extraction:
    confidence-threshold: 0.7
