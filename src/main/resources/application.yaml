server:
  port: ${PORT:8080}

logging:
  level:
    "org.atmosphere": warn
    # Suppress Spring Cloud Function warnings about multiple functional beans
    # Functions are not exported via HTTP (web.export.enabled=false)
    org.springframework.cloud.function.context.config.BeanFactoryAwareFunctionRegistry: ERROR

# UI selection: "vaadin" enables legacy Vaadin security/config; default is API-only.
pvs:
  ui: ${PVS_UI:api}

spring:
  cloud:
    function:
      # Disable HTTP export of functions - we use Services, not direct HTTP calls
      # Functions are deployed separately to OpenFaaS/AWS Lambda when needed
      web:
        export:
          enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        type: trace
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:h2:mem:pvs;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:}

app:
  single-practice:
    enabled: ${SINGLE_PRACTICE_ENABLED:true}
    auto-provision-institution: ${SINGLE_PRACTICE_AUTO_PROVISION:true}
    default-institution-code: ${SINGLE_PRACTICE_DEFAULT_CODE:PRAX-001}
    default-institution-name: ${SINGLE_PRACTICE_DEFAULT_NAME:Praxis}
    default-institution-description: ${SINGLE_PRACTICE_DEFAULT_DESCRIPTION:Single-practice default institution}
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    roles-claim: ${OIDC_ROLES_CLAIM:roles}

egk:
  tool-path: "C:/Program Files/OpenSC Project/OpenSC/tools/egk-tool.exe"

domain:
  bundesland: NI

ai:
  whisper:
    local:
      enabled: true
      host: localhost
      port: 9000
      auto-install: true
      python-path: "python"
      use-podman: true
      podman-image: "pvs-whisper:latest"
      podman-compose-path: "docker/whisper/podman-compose.yml"
    remote:
      enabled: true
      provider: "aleph-alpha"
      api-url: "https://api.aleph-alpha.com/complete"
      api-key: ${AI_API_KEY:}
      monthly-quota: 1000
  extraction:
    confidence-threshold: 0.7

# SMTP-Konfiguration
# Verschlüsselungsschlüssel für SMTP-Passwörter (NUR über Environment-Variable!)
# Muss 16, 24 oder 32 Bytes lang sein (AES-128/192/256)
smtp:
  encryption:
    key: ${SMTP_ENCRYPTION_KEY:}
