server:
  port: ${PORT:8080}

logging:
  level:
    "org.atmosphere": warn

vaadin:
  launch-browser: true
  allowed-packages: "com.vaadin,org.vaadin,com.flowingcode,de.bbajor.pvs"
  # Production Mode für Docker-Container (überschreibbar via Environment-Variable)
  production-mode: ${VAADIN_PRODUCTION_MODE:false}

spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        type: trace
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:h2:mem:pvs;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

egk:
  tool-path: "C:/Program Files/OpenSC Project/OpenSC/tools/egk-tool.exe"

domain:
  bundesland: NI

ai:
  whisper:
    local:
      enabled: true
      host: localhost
      port: 9000
      auto-install: true
      python-path: "python"
      use-docker: true
      docker-image: "pvs-whisper:latest"
      docker-compose-path: "docker/whisper/docker-compose.yml"
    remote:
      enabled: true
      provider: "aleph-alpha"
      api-url: "https://api.aleph-alpha.com/complete"
      api-key: ${AI_API_KEY:}
      monthly-quota: 1000
  extraction:
    confidence-threshold: 0.7
