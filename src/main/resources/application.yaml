server:
  port: ${PORT:8080}

logging:
  level:
    "org.atmosphere": warn

vaadin:
  launch-browser: true
  allowed-packages: "com.vaadin,org.vaadin,com.flowingcode,de.bbajor.pvs"

spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        type: trace
  servlet:
    multipart:
      enabled: false
      max-file-size: 50MB
      max-request-size: 100MB
  profiles:
    active: dev

# eGK tool path. Defaults differ on Windows vs. Linux; override via ENV or profile
egk:
  tool-path: ${EGK_TOOL_PATH:/usr/bin/egk-tool}

domain:
  bundesland: NI
