# Test-Umgebung Konfiguration
# Aktiviert mit: SPRING_PROFILES_ACTIVE=test,cloud

# Server-Konfiguration
server:
  port: ${PORT:8081}
  shutdown: graceful
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        secure: false  # HTTP für Test (via SSH-Tunnel)
        http-only: true
        same-site: lax

# Redis Session Storage (Test)
spring:
  session:
    store-type: redis
    redis:
      namespace: spring:session:pvs:test
  data:
    redis:
      host: ${REDIS_HOST:redis-test}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:0}

# Whisper AI (Test)
ai:
  whisper:
    local:
      enabled: ${AI_WHISPER_LOCAL_ENABLED:true}
      host: ${AI_WHISPER_LOCAL_HOST:whisper-test}
      port: ${AI_WHISPER_LOCAL_PORT:9001}

