spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    fail-on-missing-locations: false

management:
  endpoints:
    web:
      exposure:
        include: health,flyway,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    de.bbajor.pvs: INFO
    org.flywaydb: INFO

ai:
  whisper:
    local:
      enabled: false

