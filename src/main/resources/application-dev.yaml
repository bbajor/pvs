spring:
  jpa:
    hibernate:
      ddl-auto: ${DATABASE_DDL_AUTO:create-drop}
    show-sql: true
  datasource:
    # PostgreSQL wenn DATABASE_URL gesetzt ist, sonst H2
    url: ${DATABASE_URL:jdbc:h2:mem:testdb}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    # Flyway ist in dev deaktiviert, weil das Schema mit Hibernate create-drop erstellt wird
    # Die Migration V1__initial_schema.sql muss aktualisiert werden, wenn Flyway aktiviert wird
  h2:
    console:
      enabled: true

# Disable eGK validation in dev and leave tool-path empty unless explicitly provided
egk:
  enabled: ${EGK_ENABLED:false}
  tool-path: ${EGK_TOOL_PATH:}

logging:
  level:
    root: INFO
    de.bbajor.pvs: DEBUG

ai:
  whisper:
    local:
      enabled: true

