spring:
  cloud:
    compatibility-verifier:
      enabled: false # Disable compatibility check - Spring Cloud 2024.0.0 works with Spring Boot 3.5.7
    function:
      # Disable HTTP export of functions - we use Services, not direct HTTP calls
      # Functions are deployed separately to OpenFaaS/AWS Lambda when needed
      web:
        export:
          enabled: false
  jpa:
    hibernate:
      # H2 (default): create-drop für schnelle lokale Tests
      # Postgres-Container: update für persistente Testdaten (wird via ENV-Variable SPRING_JPA_HIBERNATE_DDL_AUTO gesetzt)
      ddl-auto: ${DATABASE_DDL_AUTO:create-drop}
    show-sql: true
  datasource:
    # PostgreSQL wenn DATABASE_URL gesetzt ist, sonst H2
    url: ${DATABASE_URL:jdbc:h2:mem:testdb}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    # Flyway ist in dev deaktiviert für H2, aktiviert für Postgres-Container
    # Die Migration V1__initial_schema.sql muss aktualisiert werden, wenn Flyway aktiviert wird
  h2:
    console:
      enabled: true

# Disable eGK validation in dev and leave tool-path empty unless explicitly provided
egk:
  enabled: ${EGK_ENABLED:false}
  tool-path: ${EGK_TOOL_PATH:}

logging:
  level:
    root: INFO
    de.bbajor.pvs: DEBUG
    # Suppress Spring Cloud Function warnings about multiple functional beans
    # Functions are not exported via HTTP (web.export.enabled=false)
    org.springframework.cloud.function: WARN
    # Specifically suppress the BeanFactoryAwareFunctionRegistry warning
    # This warning is harmless when functions are not exported via HTTP
    org.springframework.cloud.function.context.config.BeanFactoryAwareFunctionRegistry: ERROR

ai:
  whisper:
    local:
      enabled: true

# SMTP-Konfiguration für Development
# In Dev kann optional ein Test-Schlüssel verwendet werden (nur lokal!)
smtp:
  encryption:
    key: ${SMTP_ENCRYPTION_KEY:}

