version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pvs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pvs}
      POSTGRES_USER: ${POSTGRES_USER:-pvs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"  # Nur lokal erreichbar
    networks:
      - pvs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pvs_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PVS Application (Dev)
  pvs-dev:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE:-bbajor/pvs}:dev-latest
    container_name: pvs-dev
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pvs}_dev
      DATABASE_USERNAME: ${POSTGRES_USER:-pvs_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      AI_WHISPER_LOCAL_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pvs-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pvs-dev.rule=Host(`dev.pvs.example.com`)"
      - "traefik.http.routers.pvs-dev.entrypoints=websecure"
      - "traefik.http.routers.pvs-dev.tls.certresolver=letsencrypt"

  # PVS Application (Test)
  pvs-test:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE:-bbajor/pvs}:test-latest
    container_name: pvs-test
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: test
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pvs}_test
      DATABASE_USERNAME: ${POSTGRES_USER:-pvs_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      AI_WHISPER_LOCAL_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pvs-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pvs-test.rule=Host(`test.pvs.example.com`)"
      - "traefik.http.routers.pvs-test.entrypoints=websecure"
      - "traefik.http.routers.pvs-test.tls.certresolver=letsencrypt"

  # PVS Application (Production)
  pvs-prod:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE:-bbajor/pvs}:prod-latest
    container_name: pvs-prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pvs}_prod
      DATABASE_USERNAME: ${POSTGRES_USER:-pvs_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      AI_WHISPER_LOCAL_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pvs-network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pvs-prod.rule=Host(`pvs.example.com`)"
      - "traefik.http.routers.pvs-prod.entrypoints=websecure"
      - "traefik.http.routers.pvs-prod.tls.certresolver=letsencrypt"

  # Traefik Reverse Proxy mit SSL
  traefik:
    image: traefik:v2.11
    container_name: pvs-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - pvs-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.pvs.example.com`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"

networks:
  pvs-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  letsencrypt:
    driver: local
