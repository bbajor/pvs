version: '3.8'

services:
  # PostgreSQL Database für DEV
  postgres-dev:
    image: postgres:15-alpine
    container_name: pvs-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_DEV:-pvs_dev}
      POSTGRES_USER: ${POSTGRES_USER_DEV:-pvs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DEV}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5433:5432"  # Port 5433 für Dev (nur localhost)
    networks:
      - pvs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_DEV:-pvs_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - dev

  # PostgreSQL Database für TEST
  postgres-test:
    image: postgres:15-alpine
    container_name: pvs-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_TEST:-pvs_test}
      POSTGRES_USER: ${POSTGRES_USER_TEST:-pvs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_TEST}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres-data-test:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5434:5432"  # Port 5434 für Test (nur localhost)
    networks:
      - pvs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_TEST:-pvs_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - test

  # PostgreSQL Database für PRODUCTION (kritisch - eigene Resource-Limits)
  postgres-prod:
    image: postgres:15-alpine
    container_name: pvs-postgres-prod
    restart: always  # Immer neu starten bei Fehler
    environment:
      POSTGRES_DB: ${POSTGRES_DB_PROD:-pvs_prod}
      POSTGRES_USER: ${POSTGRES_USER_PROD:-pvs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PROD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
      - ./backups/prod:/backups/prod
    # KEINE PORTS exponiert - nur internes Netzwerk!
    # ports:
    #   - "127.0.0.1:5435:5432"  # Port 5435 für Prod (DEAKTIVIERT für Production Security)
    networks:
      - pvs-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_PROD:-pvs_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - prod

  # PVS Application (Dev)
  pvs-dev:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE:-bbajor/pvs}:dev-latest
    container_name: pvs-dev
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres-dev:5432/${POSTGRES_DB_DEV:-pvs_dev}
      DATABASE_USERNAME: ${POSTGRES_USER_DEV:-pvs_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD_DEV}
      AI_WHISPER_LOCAL_ENABLED: "false"
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks:
      - pvs-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pvs-dev.rule=Host(`dev.${DOMAIN:-pvs.example.com}`)"
      - "traefik.http.routers.pvs-dev.entrypoints=websecure"
      - "traefik.http.routers.pvs-dev.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pvs-dev.tls.options=default@file"
      - "traefik.http.routers.pvs-dev.middlewares=securityHeaders@file,compress@file"
      - "traefik.http.services.pvs-dev.loadbalancer.server.port=8080"
    profiles:
      - dev

  # PVS Application (Test)
  pvs-test:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE:-bbajor/pvs}:test-latest
    container_name: pvs-test
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: test
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres-test:5432/${POSTGRES_DB_TEST:-pvs_test}
      DATABASE_USERNAME: ${POSTGRES_USER_TEST:-pvs_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD_TEST}
      AI_WHISPER_LOCAL_ENABLED: "false"
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - pvs-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pvs-test.rule=Host(`test.${DOMAIN:-pvs.example.com}`)"
      - "traefik.http.routers.pvs-test.entrypoints=websecure"
      - "traefik.http.routers.pvs-test.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pvs-test.tls.options=default@file"
      - "traefik.http.routers.pvs-test.middlewares=securityHeaders@file,compress@file"
      - "traefik.http.services.pvs-test.loadbalancer.server.port=8080"
    profiles:
      - test

  # PVS Application (Production)
  pvs-prod:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE:-bbajor/pvs}:prod-latest
    container_name: pvs-prod
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres-prod:5432/${POSTGRES_DB_PROD:-pvs_prod}
      DATABASE_USERNAME: ${POSTGRES_USER_PROD:-pvs_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD_PROD}
      AI_WHISPER_LOCAL_ENABLED: "false"
    depends_on:
      postgres-prod:
        condition: service_healthy
    networks:
      - pvs-network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pvs-prod.rule=Host(`${DOMAIN:-pvs.example.com}`)"
      - "traefik.http.routers.pvs-prod.entrypoints=websecure"
      - "traefik.http.routers.pvs-prod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pvs-prod.tls.options=default@file"
      - "traefik.http.routers.pvs-prod.middlewares=securityHeaders@file,rateLimit@file,compress@file"
      - "traefik.http.services.pvs-prod.loadbalancer.server.port=8080"
      # Health Check
      - "traefik.http.services.pvs-prod.loadbalancer.healthcheck.path=/actuator/health"
      - "traefik.http.services.pvs-prod.loadbalancer.healthcheck.interval=30s"
    profiles:
      - prod

  # Traefik Reverse Proxy mit SSL & Security
  traefik:
    image: traefik:v3.0
    container_name: pvs-traefik
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "8082:8082"  # Metrics
    environment:
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
      - traefik-logs:/var/log/traefik
    networks:
      - pvs-network
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      # Dashboard Router
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN:-pvs.example.com}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.middlewares=dashboard-auth@file,securityHeaders@file"
      # Metrics
      - "traefik.http.routers.metrics.rule=Host(`metrics.${DOMAIN:-pvs.example.com}`)"
      - "traefik.http.routers.metrics.entrypoints=websecure"
      - "traefik.http.routers.metrics.service=prometheus@internal"
      - "traefik.http.routers.metrics.tls.certresolver=letsencrypt"

networks:
  pvs-network:
    driver: bridge
    internal: false  # External access via Traefik
    ipam:
      config:
        - subnet: 172.28.0.0/16
    driver_opts:
      com.docker.network.bridge.name: pvs-bridge
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"

volumes:
  postgres-data-dev:
    driver: local
  postgres-data-test:
    driver: local
  postgres-data-prod:
    driver: local
  letsencrypt:
    driver: local
  traefik-logs:
    driver: local
