version: '3.8'

services:
  # PostgreSQL Database für DEV
  postgres-dev:
    image: postgres:15-alpine
    container_name: pvs-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_DEV:-pvs_dev}
      POSTGRES_USER: ${POSTGRES_USER_DEV:-pvs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DEV}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5433:5432"  # Port 5433 für Dev
    networks:
      - pvs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_DEV:-pvs_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - dev

  # PostgreSQL Database für TEST
  postgres-test:
    image: postgres:15-alpine
    container_name: pvs-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_TEST:-pvs_test}
      POSTGRES_USER: ${POSTGRES_USER_TEST:-pvs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_TEST}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres-data-test:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5434:5432"  # Port 5434 für Test
    networks:
      - pvs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_TEST:-pvs_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - test

  # PostgreSQL Database für PRODUCTION (kritisch - eigene Resource-Limits)
  postgres-prod:
    image: postgres:15-alpine
    container_name: pvs-postgres-prod
    restart: always  # Immer neu starten bei Fehler
    environment:
      POSTGRES_DB: ${POSTGRES_DB_PROD:-pvs_prod}
      POSTGRES_USER: ${POSTGRES_USER_PROD:-pvs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PROD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
      - ./backups/prod:/backups/prod
    ports:
      - "127.0.0.1:5435:5432"  # Port 5435 für Prod
    networks:
      - pvs-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_PROD:-pvs_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - prod

  # PVS Application (Dev)
  pvs-dev:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE:-bbajor/pvs}:dev-latest
    container_name: pvs-dev
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres-dev:5432/${POSTGRES_DB_DEV:-pvs_dev}
      DATABASE_USERNAME: ${POSTGRES_USER_DEV:-pvs_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD_DEV}
      # Vaadin Production Mode aktiv (Frontend-Bundle ist im JAR enthalten)
      VAADIN_PRODUCTION_MODE: "true"
      # Erlaube Production Mode mit Dev-Profil für Docker-Umgebung
      VAADIN_ALLOW_PRODUCTION_MODE_IN_DEV: "true"
      AI_WHISPER_LOCAL_ENABLED: "false"
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks:
      - pvs-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pvs-dev.rule=Host(`dev.pvs.example.com`)"
      - "traefik.http.routers.pvs-dev.entrypoints=websecure"
      - "traefik.http.routers.pvs-dev.tls.certresolver=letsencrypt"
    profiles:
      - dev

  # PVS Application (Test)
  pvs-test:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE:-bbajor/pvs}:test-latest
    container_name: pvs-test
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: test
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres-test:5432/${POSTGRES_DB_TEST:-pvs_test}
      DATABASE_USERNAME: ${POSTGRES_USER_TEST:-pvs_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD_TEST}
      # Vaadin Production Mode aktiv (Frontend-Bundle ist im JAR enthalten)
      VAADIN_PRODUCTION_MODE: "true"
      AI_WHISPER_LOCAL_ENABLED: "false"
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - pvs-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pvs-test.rule=Host(`test.pvs.example.com`)"
      - "traefik.http.routers.pvs-test.entrypoints=websecure"
      - "traefik.http.routers.pvs-test.tls.certresolver=letsencrypt"
    profiles:
      - test

  # PVS Application (Production)
  pvs-prod:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE:-bbajor/pvs}:prod-latest
    container_name: pvs-prod
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres-prod:5432/${POSTGRES_DB_PROD:-pvs_prod}
      DATABASE_USERNAME: ${POSTGRES_USER_PROD:-pvs_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD_PROD}
      # Vaadin Production Mode aktiv (Frontend-Bundle ist im JAR enthalten)
      VAADIN_PRODUCTION_MODE: "true"
      AI_WHISPER_LOCAL_ENABLED: "false"
      # SMTP configuration for email sending
      SMTP_HOST: ${SMTP_HOST:}
      SMTP_PORT: ${SMTP_PORT:587}
      SMTP_USERNAME: ${SMTP_USERNAME:}
      SMTP_PASSWORD: ${SMTP_PASSWORD:}
      # MFA issuer name
      MFA_ISSUER: ${MFA_ISSUER:PVS}
      # Super-Admin initial password (optional - if not set, random password is generated)
      SUPER_ADMIN_INITIAL_PASSWORD: ${SUPER_ADMIN_INITIAL_PASSWORD:}
    depends_on:
      postgres-prod:
        condition: service_healthy
    networks:
      - pvs-network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pvs-prod.rule=Host(`pvs.example.com`)"
      - "traefik.http.routers.pvs-prod.entrypoints=websecure"
      - "traefik.http.routers.pvs-prod.tls.certresolver=letsencrypt"
    profiles:
      - prod

  # Traefik Reverse Proxy mit SSL
  traefik:
    image: traefik:v2.11
    container_name: pvs-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - pvs-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.pvs.example.com`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"

networks:
  pvs-network:
    driver: bridge

volumes:
  postgres-data-dev:
    driver: local
  postgres-data-test:
    driver: local
  postgres-data-prod:
    driver: local
  letsencrypt:
    driver: local
