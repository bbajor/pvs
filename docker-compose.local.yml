version: '3.8'

services:
  # Main Application (ohne Whisper-Dependency für lokales Testing)
  pvs-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pvs-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - PORT=8080
      # Whisper disabled für lokales Testing
      - AI_WHISPER_LOCAL_ENABLED=false
    networks:
      - pvs-network
    restart: unless-stopped
    volumes:
      # Mount H2 database file for persistence (if using file-based H2)
      - pvs-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  pvs-network:
    driver: bridge

volumes:
  pvs-data:
    driver: local
