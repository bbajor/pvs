server.port=8081

spring.datasource.url=jdbc:postgresql://kbv-db:5432/kbv
spring.datasource.username=kbv
spring.datasource.password=kbv
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

kbv.download.enabled=true
kbv.download.target-dir=/data/kbv
# Beispiel-URLs (ZIPs) für ICD (anpassen auf Quartalsrelease)
kbv.download.zip-urls=https://update.kbv.de/ita-update/Stammdateien/KBV_Stammdateien/ICD10-GM/Medizinische_Fachdaten/zip/ICD10GM2025.zip
