# Gradle Build Performance & Caching
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Kotlin DSL optimizations (falls verwendet)
kotlin.code.style=official

# Build Cache (empfohlen für CI/CD)
org.gradle.unsafe.configuration-cache=true
org.gradle.unsafe.configuration-cache.max-problems=10

# Parallel execution
org.gradle.workers.max=4

# Dependency resolution optimization
org.gradle.resolution-strategy=fast

# File watching (dev performance)
org.gradle.vfs.watch=true

# Build scan (optional für Debugging)
# org.gradle.scan=true

