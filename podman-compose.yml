version: '3.9'

services:
  # Main Application
  pvs-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pvs-app:latest
    container_name: pvs-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - PORT=8080
      - OIDC_ISSUER_URI=${OIDC_ISSUER_URI:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      - OIDC_ROLES_CLAIM=${OIDC_ROLES_CLAIM:-roles}
      # Whisper Container URL - use service name for internal Docker network
      - AI_WHISPER_LOCAL_HOST=whisper
      - AI_WHISPER_LOCAL_PORT=9000
    depends_on:
      - db-app
      - whisper
    networks:
      - pvs-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # React Frontend (Nginx + reverse proxy to API)
  pvs-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pvs-frontend:latest
    container_name: pvs-frontend
    ports:
      - "8081:80"
    depends_on:
      - pvs-app
    networks:
      - pvs-network
    restart: unless-stopped

  # Main Application Database
  db-app:
    image: postgres:16-alpine
    container_name: pvs-app-db
    environment:
      - POSTGRES_DB=pvs
      - POSTGRES_USER=pvs
      - POSTGRES_PASSWORD=pvs
    ports:
      - "5432:5432"
    volumes:
      - pvs_app_pg:/var/lib/postgresql/data
    networks:
      - pvs-network
    restart: unless-stopped

  # Whisper AI Service
  whisper:
    build:
      context: .
      dockerfile: docker/whisper/Dockerfile
    container_name: pvs-whisper
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
    networks:
      - pvs-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  pvs-network:
    driver: bridge

volumes:
  pvs_app_pg:
    driver: local
